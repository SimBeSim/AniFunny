<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniFunny Web</title>
<style>
    body { font-family: 'Courier New', monospace; background: #111; color: #fff; padding: 2rem; }
    .frame { display: none; white-space: pre-wrap; font-size: 1.1rem; line-height: 1.5; }
    .active { display: block; }
    .speaker { color: #0f0; font-weight: bold; }
    #nextBtn { margin-top: 1rem; padding: 0.5rem 1rem; font-size: 1rem; }
    .cursor { display: inline-block; width: 10px; background: #0f0; animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { 50% { background: transparent; } }
</style>
</head>
<body>
<h1>AniFunny Typanimatie</h1>
<div id="output"></div>
<button id="nextBtn">Volgende</button>
<script>
const frames = [
    {speaker: 'Maxi', text: `Hey Sammy, ik heb een idee voor een animatie.`},
    {speaker: 'Samanta', text: `Wat dan?`},
    {speaker: 'Maxi', text: `Dat we dit gesprek omzetten in een typende scène.`},
    {speaker: 'Samanta', text: `Dat is vet. Laat maar zien dan!`}]

let current = -1;
const output = document.getElementById("output");
const btn = document.getElementById("nextBtn");

function typeText(text, speaker, callback) {
    output.innerHTML = `<div class='speaker'>${speaker}:</div><div id='typed'></div>`;
    const el = document.getElementById("typed");
    let i = 0;
    const interval = setInterval(() => {
        el.innerHTML = text.slice(0, i) + '<span class="cursor"> </span>';
        i++;
        if (i > text.length) {
            clearInterval(interval);
            el.innerHTML = text;
            callback();
        }
    }, 25);
}

function showNext() {
    current++;
    if (current >= frames.length) {
        output.innerHTML = '<em>Einde</em>';
        btn.disabled = true;
        return;
    }
    const f = frames[current];
    typeText(f.text, f.speaker, () => {});
}

btn.addEventListener("click", showNext);
</script>
</body>
</html>
